<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Local Stock Dashboard — Compact with Checkboxes (Fixed)</title>

<!-- Chart.js and DataLabels plugin -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

<style>
  body { font-family: Arial, sans-serif; padding: 16px; transition: background .2s, color .2s; }
  .container { max-width: 920px; margin: auto; }
  .controls { display:flex; gap:12px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .card { padding:12px; border-radius:10px; margin-bottom:10px; background:#f5f6fb; }
  canvas { display:block; width:100% !important; max-height:240px; }
  .top-legend { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .legend-checkbox { display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:6px; background:rgba(0,0,0,0.03); font-size:13px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .btn { padding:7px 10px; border-radius:6px; border:none; cursor:pointer; background:#0b79d0; color:white; font-size:13px; }
  .btn-toggle { background:#333; }
  .pos { color:#0a8b29; font-weight:600; }
  .neg { color:#c02323; font-weight:600; }
  .neutral { color:#666; font-weight:600; }
  #momentumLegend { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
</style>
</head>
<body>
<div class="container">
  <h3>📊 Local Stock Dashboard — Compact</h3>

  <div class="controls">
    <input id="fileInput" type="file" accept=".txt,.csv">
    <button id="toggleMode" class="btn btn-toggle">Toggle Dark/Light</button>

    <div style="margin-left:auto; display:flex; gap:8px; align-items:center;">
      <div id="topLegend" class="top-legend" aria-live="polite"></div>
      <button id="selectAllBtn" class="btn" style="white-space:nowrap; display:none">Select All</button>
    </div>
  </div>

  <div id="charts" style="display:none;">
    <div id="card1" class="card">
      <div style="font-weight:600; margin-bottom:6px;">Price Trend (90D → 30D → 7D → Current)</div>
      <canvas id="priceChart"></canvas>
    </div>

    <div id="card2" class="card">
      <div style="font-weight:600; margin-bottom:6px;">% Change Chart (90→30, 30→7, 7→Current)</div>
      <canvas id="percentChart"></canvas>

      <!-- Momentum legend -->
      <div id="momentumLegend"></div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // register plugin safely
  if (typeof ChartDataLabels !== 'undefined') {
    Chart.register(ChartDataLabels);
  } else {
    console.warn('ChartDataLabels plugin not found.');
  }

  Chart.defaults.font.family = 'Arial, sans-serif';

  let priceChart = null;
  let percentChart = null;
  let currentSymbols = []; // list of symbols in order
  let checkboxStates = {}; // symbol -> boolean

  document.getElementById('toggleMode').onclick = () => {
    document.body.classList.toggle('dark-mode');
    document.querySelectorAll('.card').forEach(c => c.classList.toggle('dark-card'));
  };

  // helper: create top checkboxes and select button
  function renderTopLegend(items) {
    const topLegend = document.getElementById('topLegend');
    topLegend.innerHTML = '';
    const selectBtn = document.getElementById('selectAllBtn');
    selectBtn.style.display = items.length ? 'inline-block' : 'none';

    // reset states
    checkboxStates = {};

    items.forEach(it => {
      const wrapper = document.createElement('label');
      wrapper.className = 'legend-checkbox';
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = it.color;

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      cb.dataset.symbol = it.symbol;
      cb.style.cursor = 'pointer';

      const txt = document.createElement('span');
      txt.innerHTML = `<strong>${it.symbol}</strong>`;

      wrapper.appendChild(cb);
      wrapper.appendChild(dot);
      wrapper.appendChild(txt);
      topLegend.appendChild(wrapper);

      checkboxStates[it.symbol] = true;

      cb.addEventListener('change', (e) => {
        const sym = e.target.dataset.symbol;
        checkboxStates[sym] = e.target.checked;
        updateDatasetVisibility(sym, e.target.checked);
        updateSelectBtnLabel();
      });
    });

    updateSelectBtnLabel();
    selectBtn.onclick = () => {
      const allSelected = areAllSelected();
      const targetState = !allSelected;
      document.querySelectorAll('#topLegend input[type="checkbox"]').forEach(cb => {
        cb.checked = targetState;
        checkboxStates[cb.dataset.symbol] = targetState;
        updateDatasetVisibility(cb.dataset.symbol, targetState);
      });
      updateSelectBtnLabel();
    };
  }

  function areAllSelected() {
    const syms = Object.keys(checkboxStates);
    if (!syms.length) return false;
    return syms.every(s => checkboxStates[s] === true);
  }

  function updateSelectBtnLabel() {
    const btn = document.getElementById('selectAllBtn');
    if (!btn) return;
    btn.textContent = areAllSelected() ? 'Deselect All' : 'Select All';
  }

  // Robust: find dataset by label instead of relying on index
  function updateDatasetVisibility(symbol, visible) {
    try {
      if (!priceChart || !percentChart) return;
      const show = !!visible;
      // price chart
      const pDs = priceChart.data.datasets;
      for (let ds of pDs) {
        if (ds.label === symbol) {
          ds.hidden = !show;
        }
      }
      // percent chart
      const qDs = percentChart.data.datasets;
      for (let ds of qDs) {
        if (ds.label === symbol) {
          ds.hidden = !show;
        }
      }
      priceChart.update();
      percentChart.update();
    } catch (err) {
      console.error('updateDatasetVisibility error', err);
    }
  }

  function renderMomentumLegend(items) {
    const legendDiv = document.getElementById('momentumLegend');
    legendDiv.innerHTML = '';
    items.forEach(it => {
      const item = document.createElement('div');
      item.style.display = 'flex';
      item.style.alignItems = 'center';
      item.style.gap = '8px';
      item.style.padding = '6px 8px';
      item.style.borderRadius = '6px';
      item.style.background = 'rgba(0,0,0,0.03)';
      item.style.fontSize = '13px';
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = it.color;
      const text = document.createElement('div');
      const avgText = (it.avg >= 0 ? '+' : '') + it.avg + '%';
      const cls = it.avg > 0 ? 'pos' : (it.avg < 0 ? 'neg' : 'neutral');
      text.innerHTML = `<strong>${it.symbol}</strong>&nbsp;&nbsp;<span class="${cls}">${avgText}</span>&nbsp;&nbsp;<span class="${cls}">(${it.momentum})</span>`;
      item.appendChild(dot);
      item.appendChild(text);
      legendDiv.appendChild(item);
    });
  }

  document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const lines = ev.target.result.trim().split(/\r?\n/).filter(Boolean);
        if (lines.length < 2) throw new Error('file must have header + at least one data row');

        const priceLabels = ['90D Ago','30D Ago','7D Ago','Current'];
        const pctLabels = ['90→30D %','30→7D %','7D→Current %'];

        const datasetsPrice = [];
        const datasetsPercent = [];
        const legendItems = [];
        currentSymbols = [];

        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(',').map(s => s.trim());
          if (cols.length < 5) continue;

          const symbol = cols[0];
          const current = parseFloat(cols[1]);
          const d7 = parseFloat(cols[2]);
          const d30 = parseFloat(cols[3]);
          const d90 = parseFloat(cols[4]);

          currentSymbols.push(symbol);

          const prices = [d90, d30, d7, current];

          const p90_30 = d90 ? ((d30 - d90) / d90 * 100) : 0;
          const p30_7  = d30 ? ((d7 - d30) / d30 * 100) : 0;
          const p7_cur = d7  ? ((current - d7) / d7 * 100) : 0;

          const percentNums = [Number(p90_30.toFixed(2)), Number(p30_7.toFixed(2)), Number(p7_cur.toFixed(2))];
          const avg = Number(((percentNums[0] + percentNums[1] + percentNums[2]) / 3).toFixed(2));
          const momentum = avg > 0 ? 'Positive' : (avg < 0 ? 'Negative' : 'Neutral');
          const lineColor = avg >= 0 ? '#0a8b29' : '#c02323';
          const pointColors = percentNums.map(v => v > 0 ? '#0a8b29' : (v < 0 ? '#c02323' : '#666'));

          datasetsPrice.push({
            label: symbol,
            data: prices,
            borderColor: lineColor,
            borderWidth: 2,
            tension: 0.2,
            pointRadius: 3,
            fill: false
          });

          datasetsPercent.push({
            label: symbol,
            data: percentNums,
            borderColor: lineColor,
            borderWidth: 2,
            tension: 0.2,
            pointBackgroundColor: pointColors,
            pointRadius: 5,
            fill: false
          });

          legendItems.push({ symbol, avg, momentum, color: lineColor });
        }

        // show charts area
        document.getElementById('charts').style.display = 'block';

        // destroy old charts
        if (priceChart) { try { priceChart.destroy(); } catch(e){} }
        if (percentChart) { try { percentChart.destroy(); } catch(e){} }

        // price chart
        priceChart = new Chart(document.getElementById('priceChart'), {
          type: 'line',
          data: { labels: priceLabels, datasets: datasetsPrice },
          options: {
            plugins: { legend: { display: false } },
            maintainAspectRatio: true,
            aspectRatio: 2.2,
            scales: { y: { beginAtZero: false } }
          }
        });

        // percent chart
        percentChart = new Chart(document.getElementById('percentChart'), {
          type: 'line',
          data: { labels: pctLabels, datasets: datasetsPercent },
          options: {
            plugins: {
              legend: { display: false },
              datalabels: {
                anchor: 'end',
                align: 'top',
                formatter: v => (v >= 0 ? '+' : '') + v + '%',
                font: { weight: '600', size: 11 }
              },
              tooltip: {
                callbacks: {
                  label: ctx => ctx.dataset.label + ': ' + (ctx.raw >= 0 ? '+' : '') + ctx.raw + '%',
                  afterBody: items => {
                    const ds = items[0].dataset;
                    const vals = ds.data.map(Number);
                    const avg = (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2);
                    const momentum = avg > 0 ? 'Positive' : (avg < 0 ? 'Negative' : 'Neutral');
                    return ['Avg: ' + (avg >= 0 ? '+' : '') + avg + '%', 'Momentum: ' + momentum];
                  }
                }
              }
            },
            maintainAspectRatio: true,
            aspectRatio: 2.2,
            scales: { y: { beginAtZero: false, ticks: { callback: v => v + '%' } } }
          },
          plugins: [ChartDataLabels]
        });

        // top legend and momentum legend
        renderTopLegend(legendItems);
        renderMomentumLegend(legendItems);

        console.log('Charts rendered for symbols:', currentSymbols);

      } catch (err) {
        console.error('Parsing/render error', err);
        alert('Error: ' + (err && err.message ? err.message : err));
      }
    };
    reader.readAsText(file);
  });

}); // DOMContentLoaded
</script>
</body>
</html>
